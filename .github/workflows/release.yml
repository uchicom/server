name: Create and publish a package

on:
  push:
    branches: [ release ]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Create Tag name
      id: project
      run: |
        echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> "$GITHUB_OUTPUT"
        echo "name=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.name}' --non-recursive exec:exec)" >> "$GITHUB_OUTPUT"
    - name: Create Tag
      run: |
        git tag ${{ steps.project.outputs.version }}
        git push origin ${{ steps.project.outputs.version }}
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.project.outputs.version }}
        NAME: ${{ steps.project.outputs.name }}
      run: |
        cat > release-notes.md <<EOT
        # Maven Central
        https://search.maven.org/artifact/com.uchicom/${NAME}/${VERSION}/jar
        # Apache Maven
        \`\`\`
        <dependency>
          <groupId>com.uchicom</groupId>
          <artifactId>${NAME}</artifactId>
          <version>${VERSION}</version>
        </dependency>
        \`\`\`
        EOT
        gh release create "${VERSION}" "./target/${NAME}-${VERSION}.jar" \
          --title "Release v${VERSION}" \
          --notes-file release-notes.md
